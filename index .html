<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turnover — Property Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#1C2B33;
    --ink-2:#2A3D47;
    --paper:#F3EFE6;
    --paper-2:#EAE4D6;
    --card:#FBF9F3;
    --brass:#A9824C;
    --brass-2:#C9A66B;
    --sage:#5F8267;
    --sage-2:#E7EEE7;
    --rust:#B5533C;
    --rust-2:#F6E7E2;
    --mist:#D8D2C2;
    --ink-soft:#5B6B72;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;}
  #app{max-width:560px; margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0; letter-spacing:-0.01em;}
  button{font-family:inherit; cursor:pointer;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--brass);}

  /* ---- top bar ---- */
  .topbar{background:var(--ink); color:var(--paper); padding:18px 20px 16px; position:sticky; top:0; z-index:10;}
  .topbar .row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .tag{width:30px; height:30px; border-radius:7px; background:linear-gradient(155deg,var(--brass-2),var(--brass)); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; color:var(--ink); font-size:15px; flex-shrink:0;}
  .brand-name{font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:#fff;}
  .brand-sub{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#9FB0B6; margin-top:1px;}
  .mode-switch{display:flex; background:rgba(255,255,255,.08); border-radius:20px; padding:3px; gap:2px;}
  .mode-switch button{border:none; background:transparent; color:#B9C6CA; font-size:12px; font-weight:600; padding:7px 12px; border-radius:16px; transition:.15s;}
  .mode-switch button.active{background:var(--paper); color:var(--ink);}
  .backbtn{background:none; border:none; color:var(--paper); font-size:14px; display:flex; align-items:center; gap:6px; padding:4px 0; font-weight:600;}

  /* ---- content ---- */
  .content{flex:1; padding:20px 20px 90px;}
  .lede{font-size:13px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}

  /* ---- hanging tag cards (signature element) ---- */
  .tagcard{position:relative; background:var(--card); border:1px solid var(--mist); border-radius:4px 12px 12px 4px; padding:18px 18px 18px 26px; margin-bottom:14px; box-shadow:0 1px 0 rgba(0,0,0,.03); transition:transform .12s;}
  .tagcard:active{transform:scale(.985);}
  .tagcard::before{content:''; position:absolute; left:10px; top:50%; transform:translateY(-50%); width:8px; height:8px; border-radius:50%; background:var(--paper); border:1.5px solid var(--ink-soft);}
  .tagcard::after{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:repeating-linear-gradient(180deg, var(--brass) 0 6px, transparent 6px 12px);}
  .tagcard-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .tagcard h3{font-size:18px; font-weight:600;}
  .tagcard .meta{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .pill{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:4px 9px; border-radius:20px; font-weight:600; white-space:nowrap;}
  .pill.done{background:var(--sage-2); color:var(--sage);}
  .pill.progress{background:#F1E7D3; color:var(--brass);}
  .pill.flag{background:var(--rust-2); color:var(--rust);}
  .pill.none{background:var(--paper-2); color:var(--ink-soft);}
  .progressbar{height:5px; background:var(--paper-2); border-radius:4px; margin-top:12px; overflow:hidden;}
  .progressbar > div{height:100%; background:linear-gradient(90deg,var(--brass-2),var(--brass));}

  /* ---- room grid ---- */
  .roomgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .roomcell{background:var(--card); border:1px solid var(--mist); border-radius:10px; padding:14px; text-align:left;}
  .roomcell .rname{font-weight:600; font-size:14px; margin-bottom:6px;}
  .roomcell .rstat{font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:1px;}
  .dot.d-done{background:var(--sage);} .dot.d-part{background:var(--brass);} .dot.d-none{background:var(--mist);} .dot.d-flag{background:var(--rust);}

  /* ---- checklist ---- */
  .checkitem{display:flex; align-items:flex-start; gap:12px; padding:14px 0; border-bottom:1px solid var(--paper-2);}
  .checkitem:last-child{border-bottom:none;}
  .cbox{width:24px; height:24px; border-radius:7px; border:2px solid var(--mist); flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--card); margin-top:1px;}
  .cbox.checked{background:var(--sage); border-color:var(--sage);}
  .cbox svg{width:14px; height:14px; stroke:white; fill:none; stroke-width:3;}
  .clabel{flex:1; font-size:14.5px; line-height:1.4; padding-top:2px;}
  .clabel.checked{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--mist);}
  .camicon{width:38px; height:38px; border-radius:8px; border:1.5px dashed var(--mist); background:var(--paper); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .camicon svg{width:17px; height:17px; stroke:var(--ink-soft); fill:none; stroke-width:1.8;}
  .polaroid{width:38px; height:38px; border-radius:8px; overflow:hidden; border:1.5px solid var(--mist); flex-shrink:0;}
  .polaroid img{width:100%; height:100%; object-fit:cover; display:block;}

  .sectiontitle{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--brass); margin:26px 0 4px;}

  textarea{width:100%; border:1px solid var(--mist); border-radius:10px; padding:12px; font-family:'Inter',sans-serif; font-size:13.5px; background:var(--card); resize:vertical; min-height:70px; margin-top:8px;}
  textarea:focus{outline:2px solid var(--brass-2); outline-offset:1px;}

  .flagtoggle{display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--mist); border-radius:10px; padding:13px 15px; margin-top:10px;}
  .flagtoggle.on{background:var(--rust-2); border-color:#DDB6A8;}
  .switch{width:40px; height:23px; border-radius:20px; background:var(--mist); position:relative; flex-shrink:0;}
  .switch.on{background:var(--rust);}
  .switch::after{content:''; position:absolute; width:17px; height:17px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.15s;}
  .switch.on::after{left:20px;}

  .primarybtn{width:100%; padding:15px; border:none; border-radius:11px; background:var(--ink); color:var(--paper); font-weight:600; font-size:14.5px; margin-top:18px;}
  .primarybtn:disabled{opacity:.4;}
  .ghostbtn{width:100%; padding:14px; border:1.5px solid var(--mist); border-radius:11px; background:transparent; color:var(--ink); font-weight:600; font-size:14px; margin-top:10px;}
  .textbtn{background:none;border:none;color:var(--brass);font-weight:600;font-size:13px;}

  /* ---- inputs ---- */
  .field{margin-bottom:16px;}
  .field label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px;}
  .field input{width:100%; padding:13px 14px; border:1.5px solid var(--mist); border-radius:10px; font-size:15px; background:var(--card); font-family:inherit;}
  .field input:focus{outline:2px solid var(--brass-2); outline-offset:1px;}

  .empty{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty h3{color:var(--ink); margin-bottom:8px;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:20px; font-size:13px; font-weight:500; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s;}
  .toast.show{opacity:1;}

  .thumbrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .thumb{width:64px; height:64px; border-radius:9px; overflow:hidden; border:1.5px solid var(--mist); position:relative;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .thumb .cap{position:absolute; bottom:0; left:0; right:0; background:rgba(28,43,51,.72); color:#fff; font-size:8px; padding:2px 4px; font-family:'JetBrains Mono',monospace; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .histrow{display:flex; justify-content:space-between; align-items:center; padding:12px 4px; border-bottom:1px solid var(--paper-2); font-size:13px;}
  .histrow:last-child{border-bottom:none;}
  .histrow .l{color:var(--ink-soft);}

  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite; display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .loadwrap{display:flex; align-items:center; justify-content:center; min-height:60vh; color:var(--ink-soft); font-size:13px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">

<script>
/* =========================================================
   DATA MODEL
   ========================================================= */
const ROOM_TYPES = {
  bedroom: { label:'Bedroom', items:[
    'Bed made with fresh linen','Surfaces dusted & clear','Floor vacuumed / mopped',
    'Wardrobe & drawers empty','Windows & mirrors clean','No damage, marks or stains','Bin emptied'
  ]},
  ensuite: { label:'Bedroom & En-suite', items:[
    'Bed made with fresh linen','Surfaces dusted & clear','Floor vacuumed / mopped','Wardrobe & drawers empty',
    'En-suite toilet cleaned & disinfected','Shower cleaned, no residue','Sink & taps polished','Towels replaced',
    'Toiletries restocked','No damage, marks or stains','Bin emptied'
  ]},
  bathroom: { label:'Bathroom', items:[
    'Toilet cleaned & disinfected','Shower / bath cleaned, no residue','Sink & taps polished',
    'Floor mopped','Towels replaced','Toiletries restocked','Mirror streak-free','Bin emptied'
  ]},
  halfbath: { label:'Cloakroom / WC', items:[
    'Toilet cleaned & disinfected','Sink & taps polished','Floor mopped','Mirror streak-free','Bin emptied'
  ]},
  kitchen: { label:'Kitchen', items:[
    'Countertops cleaned','Appliances wiped (oven / microwave / fridge)','Dishes & cutlery clean and stored',
    'Bin emptied, new liner fitted','Floor mopped','Cupboards restocked (basics)'
  ]},
  lounge: { label:'Living Room', items:[
    'Sofas & cushions tidy','Surfaces dusted','Floor vacuumed','TV & remote wiped and working',
    'Windows clean','No damage or marks'
  ]},
  dining: { label:'Dining Room', items:[
    'Table & chairs cleaned','Floor swept / mopped','Surfaces dusted','Place settings tidy'
  ]},
  games: { label:'Games Room', items:[
    'Equipment tidy & accounted for','Surfaces cleaned','Floor cleaned','No damage to games or equipment'
  ]},
  garden: { label:'Garden', items:[
    'Furniture clean & arranged','Bins emptied','Pathways clear','Lawn / patio tidy'
  ]},
  hottub: { label:'Hot Tub', items:[
    'Water clear and clean','Cover clean & secure','Surrounding area tidy','Chemicals / levels checked'
  ]},
  balcony: { label:'Balcony', items:[
    'Furniture clean','Floor swept','Railings & glass clean','No debris'
  ]},
  laundry: { label:'Laundry Room', items:[
    'Washer / dryer empty and clean','Surfaces wiped','Floor clean','Supplies stocked'
  ]}
};

const PROPERTIES = [
  { id:'p1', name:'Property 1', sub:'4 bed · garden & hot tub', rooms:[
    {id:'bed1',name:'Bedroom 1',type:'bedroom'},{id:'bed2',name:'Bedroom 2',type:'bedroom'},
    {id:'bed3',name:'Bedroom 3',type:'bedroom'},{id:'bed4',name:'Bedroom 4',type:'bedroom'},
    {id:'dining',name:'Dining Room',type:'dining'},{id:'games',name:'Games Room',type:'games'},
    {id:'living',name:'Living Room',type:'lounge'},
    {id:'bath1',name:'Bathroom 1',type:'bathroom'},{id:'bath2',name:'Bathroom 2',type:'bathroom'},
    {id:'bath3',name:'Bathroom 3',type:'bathroom'},{id:'cloak',name:'Cloakroom / WC',type:'halfbath'},
    {id:'garden',name:'Garden',type:'garden'},{id:'hottub',name:'Hot Tub',type:'hottub'}
  ]},
  { id:'p2', name:'Property 2', sub:'6 en-suite rooms', rooms:[
    {id:'es1',name:'Room 1',type:'ensuite'},{id:'es2',name:'Room 2',type:'ensuite'},
    {id:'es3',name:'Room 3',type:'ensuite'},{id:'es4',name:'Room 4',type:'ensuite'},
    {id:'es5',name:'Room 5',type:'ensuite'},{id:'es6',name:'Room 6',type:'ensuite'},
    {id:'lounge',name:'Lounge',type:'lounge'},{id:'balcony',name:'Balcony',type:'balcony'},
    {id:'kitchen',name:'Kitchen',type:'kitchen'},{id:'laundry',name:'Laundry Room',type:'laundry'}
  ]},
  { id:'p3', name:'Property 3', sub:'7 en-suite rooms', rooms:[
    {id:'es1',name:'Room 1',type:'ensuite'},{id:'es2',name:'Room 2',type:'ensuite'},
    {id:'es3',name:'Room 3',type:'ensuite'},{id:'es4',name:'Room 4',type:'ensuite'},
    {id:'es5',name:'Room 5',type:'ensuite'},{id:'es6',name:'Room 6',type:'ensuite'},
    {id:'es7',name:'Room 7',type:'ensuite'},
    {id:'lounge',name:'Lounge',type:'lounge'},{id:'balcony',name:'Balcony',type:'balcony'}
  ]}
];

function getProperty(id){ return PROPERTIES.find(p=>p.id===id); }
function getRoom(propId, roomId){ return getProperty(propId).rooms.find(r=>r.id===roomId); }
function roomItems(type){ return ROOM_TYPES[type].items; }

/* =========================================================
   STATE
   ========================================================= */
let S = {
  mode: 'cleaner',       // 'cleaner' | 'manager'
  view: 'home',          // home | property | room | m-property | m-inspection
  cleanerName: localStorage.getItem ? '' : '',
  currentPropertyId: null,
  currentInspectionId: null,
  currentRoomId: null,
  inspection: null,      // active inspection object while cleaning
  index: [],             // inspections-index (shared)
  cache: {},             // inspectionId -> full record (shared)
  loading: true,
  pendingPhotoItemId: null
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__tt); window.__tt = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* =========================================================
   STORAGE HELPERS — backed by Firebase Firestore
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCEU4CQIzuJGR59KNe0fO7IhUlPCk81hdI",
  authDomain: "turnover-ec796.firebaseapp.com",
  projectId: "turnover-ec796",
  storageBucket: "turnover-ec796.firebasestorage.app",
  messagingSenderId: "820568188711",
  appId: "1:820568188711:web:8e9a2c7dafc912582e2b02",
  measurementId: "G-T8E8RJ36FB"
};

let db = null;
let firebaseReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebaseReady = true;
}catch(err){
  console.error('Firebase init failed', err);
}

// Falls back to this browser's local storage only if Firestore genuinely
// can't be reached (e.g. offline, or config missing) — sync resumes once
// the connection is back, but while it's down data stays on-device only.
function localFallback(){
  return {
    async get(key){
      const v = localStorage.getItem('turnover:'+key);
      if(v===null) throw new Error('not found');
      return { key, value:v, shared:false };
    },
    async set(key, value){
      localStorage.setItem('turnover:'+key, value);
      return { key, value, shared:false };
    },
    async delete(key){
      localStorage.removeItem('turnover:'+key);
      return { key, deleted:true, shared:false };
    },
    async list(prefix){
      const p = 'turnover:'+(prefix||'');
      const keys = Object.keys(localStorage).filter(k=>k.startsWith(p)).map(k=>k.slice(9));
      return { keys, prefix, shared:false };
    }
  };
}

window.storage = firebaseReady ? {
  async get(key){
    const snap = await db.collection('kv').doc(key).get();
    if(!snap.exists) throw new Error('not found');
    return { key, value: snap.data().value, shared:true };
  },
  async set(key, value){
    await db.collection('kv').doc(key).set({ value, updatedAt: Date.now() });
    return { key, value, shared:true };
  },
  async delete(key){
    await db.collection('kv').doc(key).delete();
    return { key, deleted:true, shared:true };
  },
  async list(prefix){
    const p = prefix || '';
    const end = p + '\uf8ff';
    const snap = await db.collection('kv')
      .where(firebase.firestore.FieldPath.documentId(), '>=', p)
      .where(firebase.firestore.FieldPath.documentId(), '<=', end)
      .get();
    return { keys: snap.docs.map(d=>d.id), prefix, shared:true };
  }
} : localFallback();
async function loadIndex(){
  try{
    const r = await window.storage.get('inspections-index', true);
    S.index = r ? JSON.parse(r.value) : [];
  }catch(e){ S.index = []; }
}
async function saveIndex(){
  await window.storage.set('inspections-index', JSON.stringify(S.index), true);
}
async function loadInspection(id, forceRefresh){
  if(S.cache[id] && !forceRefresh) return S.cache[id];
  try{
    const r = await window.storage.get('inspection:'+id, true);
    const rec = r ? JSON.parse(r.value) : null;
    if(rec) S.cache[id] = rec;
    return rec;
  }catch(e){ return null; }
}
async function saveInspection(rec){
  S.cache[rec.id] = rec;
  await window.storage.set('inspection:'+rec.id, JSON.stringify(rec), true);
}
async function savePhoto(inspId, itemId, dataUrl){
  await window.storage.set('photo:'+inspId+':'+itemId, dataUrl, true);
}
async function loadPhoto(inspId, itemId){
  try{
    const r = await window.storage.get('photo:'+inspId+':'+itemId, true);
    return r ? r.value : null;
  }catch(e){ return null; }
}

function newInspectionRecord(propertyId, cleanerName){
  const prop = getProperty(propertyId);
  const rooms = {};
  prop.rooms.forEach(r=>{
    const items = {};
    roomItems(r.type).forEach((_,i)=>{ items[i]=false; });
    rooms[r.id] = { items, photos:{}, notes:'', flagged:false };
  });
  return {
    id: 'insp_'+propertyId+'_'+Date.now(),
    propertyId, cleanerName,
    startedAt: new Date().toISOString(),
    completedAt: null,
    rooms
  };
}

function inspectionStats(rec, propertyId){
  const prop = getProperty(propertyId);
  let total=0, done=0, flagged=false, roomsDone=0;
  prop.rooms.forEach(r=>{
    const items = roomItems(r.type);
    const state = rec.rooms[r.id] || {items:{}};
    let roomDone = 0;
    items.forEach((_,i)=>{ total++; if(state.items && state.items[i]){ done++; roomDone++; } });
    if(state.flagged) flagged=true;
    if(roomDone===items.length) roomsDone++;
  });
  return { total, done, flagged, roomsDone, roomsTotal: prop.rooms.length,
    pct: total? Math.round(done/total*100):0 };
}

/* =========================================================
   RENDER: TOP BAR
   ========================================================= */
function renderTopbar(showBack, backFn, title){
  return `
  <div class="topbar">
    <div class="row">
      ${showBack ? `<button class="backbtn" onclick="${backFn}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>${title||'Back'}</button>` : `
        <div class="brand">
          <div class="tag">T</div>
          <div><div class="brand-name">Turnover</div><div class="brand-sub">Housekeeping inspection</div></div>
        </div>`}
      ${!showBack ? `
      <div class="mode-switch">
        <button class="${S.mode==='cleaner'?'active':''}" onclick="setMode('cleaner')">Cleaner</button>
        <button class="${S.mode==='manager'?'active':''}" onclick="setMode('manager')">Manager</button>
      </div>` : ''}
    </div>
  </div>`;
}

function setMode(m){ S.mode=m; S.view = m==='cleaner' ? 'home':'m-home'; render(); }

/* =========================================================
   RENDER: CLEANER — HOME (property picker)
   ========================================================= */
function renderCleanerHome(){
  const html = `
    ${renderTopbar(false)}
    <div class="content">
      <div class="eyebrow">Today's turnover</div>
      <h2 style="font-size:24px;margin-top:6px;">Pick a property</h2>
      <p class="lede">Choose where you're cleaning today. Your progress saves automatically and your manager can see it live.</p>
      <div class="field" style="margin-top:20px;">
        <label>Your name</label>
        <input id="cleanerNameInput" type="text" placeholder="e.g. Priya" value="${S.cleanerName||''}" oninput="S.cleanerName=this.value">
      </div>
      ${PROPERTIES.map(p=>`
        <div class="tagcard" onclick="openProperty('${p.id}')">
          <div class="tagcard-top">
            <div>
              <h3>${p.name}</h3>
              <div class="meta">${p.sub} · ${p.rooms.length} areas to check</div>
            </div>
            <span class="pill none">Start →</span>
          </div>
        </div>
      `).join('')}
    </div>`;
  document.getElementById('app').innerHTML = html;
}

async function openProperty(propertyId){
  if(!S.cleanerName || !S.cleanerName.trim()){
    toast('Enter your name first'); 
    const el = document.getElementById('cleanerNameInput');
    if(el) el.focus();
    return;
  }
  try{
    S.currentPropertyId = propertyId;
    S.inspection = newInspectionRecord(propertyId, S.cleanerName.trim());
    S.view='property';
    render(); // move to the room grid immediately, don't block on network save
    await saveInspection(S.inspection);
    S.index.unshift({ id:S.inspection.id, propertyId, cleanerName:S.inspection.cleanerName,
      startedAt:S.inspection.startedAt, completedAt:null });
    await saveIndex();
  }catch(err){
    console.error(err);
    toast('Could not save — check connection');
  }
}

/* =========================================================
   RENDER: CLEANER — PROPERTY (room grid)
   ========================================================= */
function renderCleanerProperty(){
  const prop = getProperty(S.currentPropertyId);
  const rec = S.inspection;
  const stats = inspectionStats(rec, prop.id);
  const allDone = stats.done===stats.total;
  const html = `
    ${renderTopbar(true, "backToCleanerHome()", "Properties")}
    <div class="content">
      <div class="eyebrow">${S.cleanerName}'s inspection</div>
      <h2 style="font-size:22px;margin-top:6px;">${prop.name}</h2>
      <p class="lede">Tap a room to work through its checklist. ${stats.done}/${stats.total} tasks complete.</p>
      <div class="progressbar"><div style="width:${stats.pct}%"></div></div>
      <div class="roomgrid" style="margin-top:18px;">
        ${prop.rooms.map(r=>{
          const items = roomItems(r.type);
          const state = rec.rooms[r.id];
          const doneCount = items.filter((_,i)=>state.items[i]).length;
          let dotClass='d-none', label='Not started';
          if(state.flagged){ dotClass='d-flag'; label='Issue flagged'; }
          else if(doneCount===items.length){ dotClass='d-done'; label='Complete'; }
          else if(doneCount>0){ dotClass='d-part'; label=doneCount+'/'+items.length; }
          return `<button class="roomcell" onclick="openRoom('${r.id}')" style="text-align:left;border:1px solid var(--mist);${state.flagged?'border-color:#DDB6A8;background:var(--rust-2);':''}">
            <div class="rname">${r.name}</div>
            <div class="rstat"><span class="dot ${dotClass}"></span>${label}</div>
          </button>`;
        }).join('')}
      </div>
      <button class="primarybtn" ${allDone?'':'disabled'} onclick="finishInspection()">
        ${allDone? 'Finish & submit inspection' : `Finish inspection (${stats.done}/${stats.total} done)`}
      </button>
    </div>`;
  document.getElementById('app').innerHTML = html;
}

function backToCleanerHome(){ S.view='home'; S.inspection=null; S.currentPropertyId=null; render(); }

async function finishInspection(){
  S.inspection.completedAt = new Date().toISOString();
  await saveInspection(S.inspection);
  const idx = S.index.find(x=>x.id===S.inspection.id);
  if(idx) idx.completedAt = S.inspection.completedAt;
  await saveIndex();
  toast('Inspection submitted ✓');
  backToCleanerHome();
}

/* =========================================================
   RENDER: CLEANER — ROOM CHECKLIST
   ========================================================= */
async function openRoom(roomId){
  S.currentRoomId = roomId;
  S.view='room';
  render();
  // lazy-load any existing photos for this room's items
  const room = getRoom(S.currentPropertyId, roomId);
  const items = roomItems(room.type);
  const state = S.inspection.rooms[roomId];
  for(let i=0;i<items.length;i++){
    if(state.photos[i] && !state.photos[i].startsWith('data:')){
      const p = await loadPhoto(S.inspection.id, roomId+'-'+i);
      if(p) state.photos[i] = p;
      render();
    }
  }
}

function renderCleanerRoom(){
  const prop = getProperty(S.currentPropertyId);
  const room = getRoom(prop.id, S.currentRoomId);
  const items = roomItems(room.type);
  const state = S.inspection.rooms[room.id];
  const done = items.filter((_,i)=>state.items[i]).length;

  const html = `
    ${renderTopbar(true, "backToPropertyView()", prop.name)}
    <div class="content">
      <div class="eyebrow">${ROOM_TYPES[room.type].label}</div>
      <h2 style="font-size:22px;margin-top:6px;">${room.name}</h2>
      <p class="lede">${done}/${items.length} checked. Tap the camera to attach a photo for any item.</p>

      <div class="sectiontitle">Checklist</div>
      <div>
        ${items.map((label,i)=>{
          const checked = !!state.items[i];
          const photo = state.photos[i];
          return `
          <div class="checkitem">
            <div class="cbox ${checked?'checked':''}" onclick="toggleItem(${i})">
              ${checked? '<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>':''}
            </div>
            <div class="clabel ${checked?'checked':''}" onclick="toggleItem(${i})">${label}</div>
            ${photo ? `<div class="polaroid" onclick="triggerPhoto(${i})"><img src="${photo}"></div>` :
              `<div class="camicon" onclick="triggerPhoto(${i})"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg></div>`}
          </div>`;
        }).join('')}
      </div>

      <div class="sectiontitle">Notes for manager</div>
      <textarea placeholder="Anything worth flagging — damage, missing items, low supplies…" oninput="updateNotes(this.value)">${state.notes||''}</textarea>

      <div class="flagtoggle ${state.flagged?'on':''}" onclick="toggleFlag()">
        <div>
          <div style="font-weight:600;font-size:13.5px;">Flag an issue in this room</div>
          <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">Manager sees this immediately</div>
        </div>
        <div class="switch ${state.flagged?'on':''}"></div>
      </div>

      <button class="ghostbtn" onclick="backToPropertyView()">Done with this room</button>
    </div>`;
  document.getElementById('app').innerHTML = html;
}

function backToPropertyView(){ S.view='property'; render(); }

async function toggleItem(i){
  const state = S.inspection.rooms[S.currentRoomId];
  state.items[i] = !state.items[i];
  render();
  await saveInspection(S.inspection);
}
async function updateNotes(v){
  S.inspection.rooms[S.currentRoomId].notes = v;
  await saveInspection(S.inspection);
}
async function toggleFlag(){
  const state = S.inspection.rooms[S.currentRoomId];
  state.flagged = !state.flagged;
  render();
  await saveInspection(S.inspection);
}

function triggerPhoto(itemIndex){
  S.pendingPhotoItemId = itemIndex;
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = async function(){
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      const i = S.pendingPhotoItemId;
      const state = S.inspection.rooms[S.currentRoomId];
      state.photos[i] = dataUrl;
      state.items[i] = true;
      render();
      await savePhoto(S.inspection.id, S.currentRoomId+'-'+i, dataUrl);
      await saveInspection(S.inspection);
      toast('Photo attached');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

/* =========================================================
   RENDER: MANAGER — HOME
   ========================================================= */
function latestForProperty(propertyId){
  const list = S.index.filter(x=>x.propertyId===propertyId).sort((a,b)=> new Date(b.startedAt)-new Date(a.startedAt));
  return list[0] || null;
}
function historyForProperty(propertyId){
  return S.index.filter(x=>x.propertyId===propertyId).sort((a,b)=> new Date(b.startedAt)-new Date(a.startedAt));
}

function fmtTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString()===now.toDateString();
  const time = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  return sameDay ? 'Today, '+time : d.toLocaleDateString([], {day:'numeric', month:'short'})+', '+time;
}

async function renderManagerHome(){
  await loadIndex();
  let cards = '';
  for(const p of PROPERTIES){
    const latest = latestForProperty(p.id);
    let pillHtml = '<span class="pill none">No inspections yet</span>';
    let metaLine = 'Awaiting first turnover';
    let progHtml = '';
    if(latest){
      const rec = await loadInspection(latest.id, true);
      const stats = rec ? inspectionStats(rec, p.id) : {pct:0, roomsDone:0, roomsTotal:p.rooms.length, flagged:false};
      metaLine = (latest.completedAt? 'Completed ':'Started ') + fmtTime(latest.completedAt||latest.startedAt) + ' · ' + latest.cleanerName;
      if(stats.flagged) pillHtml = '<span class="pill flag">Issue flagged</span>';
      else if(latest.completedAt) pillHtml = '<span class="pill done">Complete</span>';
      else pillHtml = '<span class="pill progress">In progress</span>';
      progHtml = `<div class="progressbar"><div style="width:${stats.pct}%"></div></div>`;
    }
    cards += `
      <div class="tagcard" onclick="openManagerProperty('${p.id}')">
        <div class="tagcard-top">
          <div><h3>${p.name}</h3><div class="meta">${metaLine}</div></div>
          ${pillHtml}
        </div>
        ${progHtml}
      </div>`;
  }
  const html = `
    ${renderTopbar(false)}
    <div class="content">
      <div class="eyebrow">Live overview</div>
      <h2 style="font-size:24px;margin-top:6px;">Your properties</h2>
      <p class="lede">See the latest turnover for each property, anywhere. Tap a property for the full room-by-room breakdown.</p>
      <div style="margin-top:18px;">${cards}</div>
    </div>`;
  document.getElementById('app').innerHTML = html;
}

async function openManagerProperty(propertyId){
  S.currentPropertyId = propertyId;
  const latest = latestForProperty(propertyId);
  if(latest){
    S.currentInspectionId = latest.id;
    await loadInspection(latest.id, true);
  } else {
    S.currentInspectionId = null;
  }
  S.view='m-property';
  render();
}

/* =========================================================
   RENDER: MANAGER — PROPERTY DETAIL
   ========================================================= */
function renderManagerProperty(){
  const prop = getProperty(S.currentPropertyId);
  const hist = historyForProperty(prop.id);

  if(!S.currentInspectionId){
    document.getElementById('app').innerHTML = `
      ${renderTopbar(true, "backToManagerHome()", "Properties")}
      <div class="content">
        <div class="empty">
          <h3>No inspections yet</h3>
          <p>Once a cleaner starts a turnover at ${prop.name}, it'll show up here in real time.</p>
        </div>
      </div>`;
    return;
  }

  const rec = S.cache[S.currentInspectionId];
  if(!rec){
    document.getElementById('app').innerHTML = `${renderTopbar(true,"backToManagerHome()","Properties")}<div class="loadwrap">Loading…</div>`;
    return;
  }
  const stats = inspectionStats(rec, prop.id);
  const statusPill = rec.completedAt ? '<span class="pill done">Complete</span>' :
    (stats.flagged ? '<span class="pill flag">Issue flagged</span>' : '<span class="pill progress">In progress</span>');

  const html = `
    ${renderTopbar(true, "backToManagerHome()", "Properties")}
    <div class="content">
      <div class="eyebrow">${rec.completedAt?'Completed':'In progress'} · ${rec.cleanerName}</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:6px;">
        <h2 style="font-size:22px;">${prop.name}</h2>
        ${statusPill}
      </div>
      <p class="lede">Started ${fmtTime(rec.startedAt)}${rec.completedAt? ' · Finished '+fmtTime(rec.completedAt):''} · ${stats.done}/${stats.total} tasks · ${stats.roomsDone}/${stats.roomsTotal} rooms complete</p>
      <div class="progressbar"><div style="width:${stats.pct}%"></div></div>

      <div class="sectiontitle">Rooms</div>
      ${prop.rooms.map(r=>{
        const items = roomItems(r.type);
        const state = rec.rooms[r.id];
        const doneCount = items.filter((_,i)=>state.items[i]).length;
        const isOpen = S.openRoomDetail===r.id;
        return `
        <div class="tagcard" style="cursor:pointer; ${state.flagged?'border-color:#DDB6A8;background:var(--rust-2);':''}" onclick="toggleRoomDetail('${r.id}')">
          <div class="tagcard-top">
            <div>
              <h3 style="font-size:15.5px;">${r.name}</h3>
              <div class="meta">${doneCount}/${items.length} tasks ${state.flagged?'· issue flagged':''}</div>
            </div>
            <span class="pill ${state.flagged?'flag':(doneCount===items.length?'done':'progress')}">${doneCount===items.length?'Done':doneCount+'/'+items.length}</span>
          </div>
          ${isOpen ? `
            <div style="margin-top:14px;">
              ${items.map((label,i)=>`
                <div class="checkitem" style="padding:8px 0;">
                  <div class="cbox ${state.items[i]?'checked':''}" style="width:18px;height:18px;">${state.items[i]?'<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>':''}</div>
                  <div class="clabel ${state.items[i]?'checked':''}" style="font-size:13px;">${label}</div>
                </div>
              `).join('')}
              ${state.notes ? `<div style="margin-top:10px;padding:10px 12px;background:var(--paper-2);border-radius:8px;font-size:12.5px;color:var(--ink-2);"><strong>Note:</strong> ${state.notes}</div>` : ''}
              <div class="thumbrow" id="thumbs-${r.id}"></div>
            </div>
          ` : ''}
        </div>`;
      }).join('')}

      ${hist.length>1 ? `
      <div class="sectiontitle">History</div>
      <div class="tagcard">
        ${hist.map(h=>`
          <div class="histrow">
            <span class="l">${fmtTime(h.startedAt)} · ${h.cleanerName}</span>
            <a href="javascript:void(0)" class="textbtn" onclick="event.stopPropagation();viewHistoryInspection('${h.id}')">${h.id===S.currentInspectionId?'Viewing':'View'}</a>
          </div>
        `).join('')}
      </div>` : ''}
    </div>`;
  document.getElementById('app').innerHTML = html;

  if(S.openRoomDetail) loadRoomThumbs(S.openRoomDetail, rec);
}

async function loadRoomThumbs(roomId, rec){
  const room = getRoom(S.currentPropertyId, roomId);
  const items = roomItems(room.type);
  const el = document.getElementById('thumbs-'+roomId);
  if(!el) return;
  let out = '';
  for(let i=0;i<items.length;i++){
    if(rec.rooms[roomId].photos[i]){
      out += `<div class="thumb"><img src="loading"></div>`;
    }
  }
  for(let i=0;i<items.length;i++){
    if(rec.rooms[roomId].photos[i]){
      const p = await loadPhoto(rec.id, roomId+'-'+i);
      if(p){
        const t = document.createElement('div');
        t.className='thumb';
        t.innerHTML = `<img src="${p}">`;
        el.appendChild(t);
      }
    }
  }
}

function toggleRoomDetail(roomId){
  S.openRoomDetail = S.openRoomDetail===roomId ? null : roomId;
  render();
}

async function viewHistoryInspection(id){
  S.currentInspectionId = id;
  S.openRoomDetail = null;
  await loadInspection(id);
  render();
}

function backToManagerHome(){ S.view='m-home'; S.openRoomDetail=null; render(); }

/* =========================================================
   MAIN RENDER DISPATCH
   ========================================================= */
async function render(){
  if(S.view==='home') return renderCleanerHome();
  if(S.view==='property') return renderCleanerProperty();
  if(S.view==='room') return renderCleanerRoom();
  if(S.view==='m-home') return renderManagerHome();
  if(S.view==='m-property') return renderManagerProperty();
}

async function init(){
  document.getElementById('app').innerHTML = `${renderTopbar(false)}<div class="loadwrap">Loading properties…</div>`;
  try{
    await loadIndex();
  }catch(e){}
  S.loading = false;
  render();
}
init();
</script>
</body>
</html>
